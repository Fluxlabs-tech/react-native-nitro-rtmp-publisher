name: Android CI

# Builds the example app for Android, which compiles the library's Kotlin and
# C++ with it. Release calls this workflow too, on the commit it publishes.

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '**.md'
  workflow_call:

permissions:
  contents: read

jobs:
  android-compile:
    name: Build the Android example
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    - uses: actions/setup-java@v6
      with:
        distribution: 'temurin'
        java-version: '17'
    - uses: actions/setup-node@v7
      with:
        node-version-file: '.nvmrc'
        cache: 'npm'
        cache-dependency-path: |
          package-lock.json
          example/package-lock.json

    - name: Install node modules
      run: npm ci

    - name: Install example node modules
      run: npm ci
      working-directory: example

    # example/android isn't committed. Prebuild generates it and applies the
    # library's config plugin.
    - name: Generate the example's native project
      run: npx expo prebuild --platform android --no-install
      working-directory: example

    - name: Compile the example
      run: ./gradlew assembleDebug -PreactNativeArchitectures=arm64-v8a
      working-directory: example/android
